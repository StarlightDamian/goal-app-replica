name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, browser, agent host, and commit/version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected/actual behavior
      description: Include commands and sanitized errors; use synthetic fixtures.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: No credentials, cookies, tokens, private data, or unauthorized assets are included.
          required: true
