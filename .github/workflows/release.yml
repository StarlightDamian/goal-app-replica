name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts evals examples
      - run: python examples/quickstart.py
      - name: Package tracked files and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=goal-app-replica/ HEAD -o goal-app-replica.zip
          sha256sum goal-app-replica.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" goal-app-replica.zip SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME — Goal App Replica"
